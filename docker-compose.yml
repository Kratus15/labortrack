# Defines the complete local project environment using Docker.
# It starts PostgreSQL, the spring boot backend, and the React
# Nginx frontend as separate containers. Docker compose connects
# the containers together, passes required environment variables, keeps
# database data persistent, and allows the entire application to be
# started as one system.

services:

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labortrack}
      POSTGRES_USER: ${POSTGRES_USER:-labortrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # keep postgreSQL data even if container stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # check postgreSQL is ready before allowing the backend to start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labortrack} -d ${POSTGRES_DB:-labortrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"

  # project backend container
  backend:

    # build the backend image using the dockerfile in the project
    build:
      context: .
      dockerfile: Dockerfile

    # pass db, JWT, CORS, JPA and rate-limit configuration into the project app
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-labortrack}
      POSTGRES_USERNAME: ${POSTGRES_USER:-labortrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}

      CORS_ALLOWED_ORIGINS: http://localhost:3000

      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"

      RATE_LIMIT_ENABLED: "true"

    # start the backend only after postgreSQL passes its health check
    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

  # React frontend served by Nginx
  frontend:

    # build image using frontend dockerfile
    build:
      context: ./labortrack-frontend
      dockerfile: Dockerfile

    # backend container must start before frontend container
    depends_on:
      - backend

    ports:
      - "3000:80"


volumes:
  postgres_data: