# OPTIONAL LOCAL TEST CONFIG
spring.config.import=optional:file:./config/application-test.properties

# POSTGRESQL TEST DATABASE
spring.datasource.url=${TEST_POSTGRES_URL:jdbc:postgresql://localhost:5432/labortrack_test_db}
spring.datasource.username=${TEST_POSTGRES_USERNAME:postgres}
spring.datasource.password=${TEST_POSTGRES_PASSWORD:}

# TEST-ONLY JWT
security.jwt.secret=${TEST_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.expiration=1h

# JPA & FLYWAY
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# RATE LIMITING
security.rate-limit.enabled=false