# This Nginx configuration is used to serve the production
# build of the React frontend. Nginx listens for http requests
# on port 80, serves the static files generated by vite, and
# redirects unknown frontend routes back to index.html so React
# Router can handle routes such as /login, /register, or
# /admin/dashboard, etc

# Configure the Nginx web server
server {

    # listen for HTTP requests on port 80
    listen 80;
    # accept requests regardless of the hostname used
    server_name _;

    # directory containing the build React application
    root /usr/share/nginx/html;
    # default file to serve
    index index.html;

    # forward backend API requests to the spring boots container
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # serve react and allow react router to handle frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }
}
